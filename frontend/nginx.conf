server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static assets with long-lived cache
    location ~* \.(js|css|png|jpg|jpeg|svg|gif|ico|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # All other routes → index.html (React client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
